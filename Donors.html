<div class="p-6 no-print bg-gray-50 min-h-screen">
  <!-- Header Section -->
  <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
    <div>
      <h2 class="text-3xl font-extrabold text-teal-900 tracking-tight">Donor Database</h2>
      <p class="text-gray-500 text-sm mt-1">Manage donor profiles and track contributions</p>
    </div>
    <button onclick="window.openDonorModal()" class="bg-gradient-to-r from-teal-600 to-teal-500 hover:from-teal-700 hover:to-teal-600 text-white px-6 py-2.5 rounded-lg shadow-lg font-semibold flex items-center transition transform hover:-translate-y-0.5">
      <i class="fa-solid fa-user-plus mr-2"></i> Add New Donor
    </button>
  </div>

  <!-- Donor List Card -->
  <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
       <!-- Table Container -->
       <div class="p-5">
         <table id="tableDonors" class="w-full text-left border-collapse stripe hover row-border">
             <thead class="bg-gray-50 text-gray-500 uppercase text-xs font-bold tracking-wider">
                 <tr>
                     <th class="py-4 px-4 rounded-l-lg">Donor Profile</th>
                     <th class="py-4 px-4">Contact Info</th>
                     <th class="py-4 px-4">Preferred Cause</th>
                     <th class="py-4 px-4 text-center">Total Donated</th>
                     <th class="py-4 px-4 text-center">Last Activity</th>
                     <th class="py-4 px-4 text-right rounded-r-lg">Actions</th>
                 </tr>
             </thead>
             <tbody class="text-sm text-gray-700 divide-y divide-gray-100"></tbody>
         </table>
       </div>
  </div>
</div>

<!-- DONOR MODAL -->
<div id="donor_modal" class="fixed inset-0 z-50 hidden bg-gray-900 bg-opacity-75 backdrop-blur-sm flex justify-center items-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in-down transform transition-all">

    <!-- Modal Header -->
    <div class="bg-gradient-to-r from-teal-700 to-teal-600 px-6 py-5 flex justify-between items-center">
      <h3 class="font-bold text-xl text-white tracking-wide">Add/Edit Donor</h3>
      <button onclick="$('#donor_modal').addClass('hidden')" class="text-white hover:text-teal-100 transition-colors rounded-full p-1 hover:bg-white/10">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-8">
      <form id="form_donor" onsubmit="window.handleDonorSubmit(event)">
        <input type="hidden" name="_row" id="donor_row">
        <input type="hidden" name="Donor_ID" id="new_donor_id">
        <input type="hidden" name="Total_Donated" value="0">
        <input type="hidden" name="Last_Donation_Date" id="don_last_date">

        <div class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5">Full Name <span class="text-red-500">*</span></label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="Full_Name" id="don_name" required class="pl-10 w-full rounded-lg border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 py-2.5 text-gray-700 font-medium" placeholder="Enter donor name">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-5">
               <div>
                   <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5">Contact No</label>
                   <input type="text" name="Contact_Number" id="don_contact" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 py-2.5" placeholder="0300-1234567">
               </div>
               <div>
                   <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5">Email</label>
                   <input type="email" name="Email" id="don_email" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 py-2.5" placeholder="email@example.com">
               </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5">Preferred Cause</label>
                <select name="Preferred_Cause" id="don_cause" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 py-2.5 bg-gray-50">
                    <option value="General Fund">General Fund</option>
                    <option value="Limb Centre">Limb Centre</option>
                    <option value="Food Distribution">Food Distribution</option>
                    <option value="Medical Camps">Medical Camps</option>
                    <option value="Zakat">Zakat</option>
                    <option value="Sadaqah">Sadaqah</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5">Address</label>
                <textarea name="Address" id="don_addr" rows="2" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 py-2.5" placeholder="Street address, City"></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5">Notes (Internal)</label>
                <textarea name="Notes" id="don_notes" rows="2" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 py-2.5 bg-yellow-50/50" placeholder="Any special instructions..."></textarea>
            </div>
        </div>

        <div class="mt-8 pt-4 border-t border-gray-100 flex justify-end gap-3">
            <button type="button" onclick="$('#donor_modal').addClass('hidden')" class="px-5 py-2.5 rounded-lg border border-gray-300 text-gray-600 font-bold hover:bg-gray-50 transition">Cancel</button>
            <button type="submit" id="btn_save_donor" class="px-6 py-2.5 rounded-lg bg-teal-600 text-white font-bold shadow-md hover:bg-teal-700 transition flex items-center">
                <i class="fa-solid fa-save mr-2"></i> Save Donor
            </button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  /* Custom Scrollbar for modern look */
  .custom-scrollbar::-webkit-scrollbar { width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* DataTables Customization */
  .dataTables_wrapper .dataTables_length select {
      padding-right: 2rem;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.5rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
  }
  table.dataTable.display tbody tr:hover { background-color: #f0fdfa !important; cursor: default; }
  table.dataTable.no-footer { border-bottom: 1px solid #e5e7eb !important; }

  /* Animations */
  @keyframes fadeInDown { from { opacity: 0; transform: translate3d(0, -20px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
  .animate-fade-in-down { animation: fadeInDown 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
</style>

<script>
  (function waitForjQuery() {
      if (typeof window.jQuery === 'undefined') {
          setTimeout(waitForjQuery, 100);
          return;
      }

      var donors = [];
      var transactions = [];
      var isEditMode = false;

      (function(){
          if(typeof google !== 'undefined') {
              // Load Donors
              google.script.run.withSuccessHandler(d => {
                  donors = d;
                  checkRender();
              }).getData('HQ', 'Range_Donor_Database');

              // Load Transactions (Needed for calculation)
              google.script.run.withSuccessHandler(d => {
                  transactions = d;
                  checkRender();
              }).getData('HQ', 'Range_Accounts_Journal');
          }
      })();

      function checkRender() {
          // Only render if we have data (or at least loaded empty arrays)
          if(donors && transactions) {
             renderDonorTable();
          }
      }

      window.renderDonorTable = function() {
          if ($.fn.DataTable.isDataTable('#tableDonors')) { $('#tableDonors').DataTable().destroy(); }

          // MAP DONORS WITH CALCULATED FIELDS
          const processedDonors = donors.map(donor => {
              let total = 0;
              let lastDate = null;

              // Filter transactions for this donor
              const donorTrans = transactions.filter(t =>
                  t.Type === 'Income' &&
                  t.Status !== 'Cancelled' &&
                  (t.Description.includes(donor.Full_Name) || (t.Linked_Donor_ID && t.Linked_Donor_ID === donor.Donor_ID))
              );

              donorTrans.forEach(t => {
                  total += Number(t.Amount) || 0;
                  const tDate = new Date(t.Date);
                  if(!lastDate || tDate > new Date(lastDate)) {
                      lastDate = t.Date;
                  }
              });

              return {
                  ...donor,
                  Calculated_Total: total,
                  Calculated_Last_Date: lastDate || '-'
              };
          });

          $('#tableDonors').DataTable({
              data: processedDonors,
              destroy: true,
              autoWidth: false,
              pageLength: 10,
              order: [[4, 'desc']], // Sort by Total Donated Descending
              columns: [
                  {
                      data: null,
                      render: function(d, t, r) {
                          return `
                              <div class="flex items-center">
                                  <div class="h-10 w-10 rounded-full bg-teal-100 flex items-center justify-center text-teal-700 font-bold mr-3 border border-teal-200 shadow-sm">
                                      ${r.Full_Name.charAt(0).toUpperCase()}
                                  </div>
                                  <div>
                                      <div class="font-bold text-gray-800 text-base">${r.Full_Name}</div>
                                      <div class="text-xs text-gray-400 font-mono">${r.Donor_ID}</div>
                                  </div>
                              </div>
                          `;
                      }
                  },
                  {
                      data: null,
                      render: function(d, t, r) {
                          return `
                              <div class="text-sm">
                                  ${r.Contact_Number ? `<div class="text-gray-600 mb-0.5"><i class="fa-solid fa-phone text-xs w-4 text-gray-400"></i> ${r.Contact_Number}</div>` : ''}
                                  ${r.Email ? `<div class="text-gray-500 text-xs"><i class="fa-solid fa-envelope text-xs w-4 text-gray-400"></i> ${r.Email}</div>` : ''}
                              </div>
                          `;
                      }
                  },
                  {
                      data: 'Preferred_Cause',
                      render: function(d) {
                          return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100 shadow-sm">${d || 'General'}</span>`;
                      }
                  },
                  {
                      data: 'Calculated_Total',
                      className: "text-center",
                      render: function(a) {
                          return `<div class="font-bold text-green-700 text-base">Rs ${Number(a).toLocaleString()}</div>`;
                      }
                  },
                  {
                      data: 'Calculated_Last_Date',
                      className: "text-center",
                      render: function(d) {
                          if (d === '-') return '<span class="text-gray-400 text-xs italic">Never</span>';
                          return `<div class="text-sm font-medium text-gray-600">${new Date(d).toLocaleDateString()}</div>`;
                      }
                  },
                  {
                      data: null,
                      className: "text-right",
                      render: function(d,t,r) {
                          return `
                              <div class="flex justify-end gap-2">
                                  <button onclick="window.viewDonorHistory(${r._row})" class="group relative bg-purple-50 hover:bg-purple-600 text-purple-600 hover:text-white p-2 rounded-lg transition-all duration-200 shadow-sm border border-purple-100" title="View History">
                                      <i class="fa-solid fa-clock-rotate-left"></i>
                                      <span class="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">History</span>
                                  </button>
                                  <button onclick="window.editDonor(${r._row})" class="group relative bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white p-2 rounded-lg transition-all duration-200 shadow-sm border border-blue-100" title="Edit">
                                      <i class="fa-solid fa-pen"></i>
                                  </button>
                                  <button onclick="window.deleteDonor(${r._row})" class="group relative bg-red-50 hover:bg-red-600 text-red-600 hover:text-white p-2 rounded-lg transition-all duration-200 shadow-sm border border-red-100" title="Delete">
                                      <i class="fa-solid fa-trash-can"></i>
                                  </button>
                              </div>
                          `;
                      }
                  }
              ],
              language: {
                  search: "",
                  searchPlaceholder: "Search donors...",
                  lengthMenu: "Show _MENU_",
                  info: "Showing _START_ to _END_ of _TOTAL_ donors",
                  paginate: { first: "«", last: "»", next: "›", previous: "‹" }
              }
          });
      };

      window.openDonorModal = function() { $('#form_donor')[0].reset(); isEditMode=false; $('#new_donor_id').val("D-" + Date.now()); $('#donor_modal').removeClass('hidden'); };

      window.editDonor = function(rowId) {
          const d = donors.find(r => r._row === rowId); if(!d) return;
          isEditMode = true;
          $('#donor_row').val(d._row);
          $('#new_donor_id').val(d.Donor_ID);
          $('#don_name').val(d.Full_Name);
          $('#don_contact').val(d.Contact_Number);
          $('#don_email').val(d.Email);
          $('#don_cause').val(d.Preferred_Cause);
          $('#don_addr').val(d.Address);
          $('#don_notes').val(d.Notes);
          $('#don_last_date').val(d.Last_Donation_Date);
          $('#donor_modal').removeClass('hidden');
      };

      window.handleDonorSubmit = function(e) {
          e.preventDefault();
          const btn = $('#btn_save_donor'); btn.html('<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Saving...').prop('disabled', true);
          const fd = {}; $('#form_donor').serializeArray().forEach(i => fd[i.name] = i.value);
          const action = isEditMode ? 'updateData' : 'addData';
          const args = isEditMode ? ['HQ', 'Range_Donor_Database', fd._row, fd] : ['HQ', 'Range_Donor_Database', fd];

          google.script.run.withSuccessHandler(() => {
              alert("Donor Saved Successfully!");
              $('#donor_modal').addClass('hidden');
              // Reload Donors to refresh table
              google.script.run.withSuccessHandler(d => { donors = d; checkRender(); }).getData('HQ', 'Range_Donor_Database');
              btn.html('<i class="fa-solid fa-save mr-2"></i> Save Donor').prop('disabled',false);
          }).withFailureHandler(err => {
              alert("Error: " + err.message);
              btn.html('<i class="fa-solid fa-save mr-2"></i> Save Donor').prop('disabled',false);
          })[action](...args);
      };

      window.deleteDonor = function(id) {
          if(confirm("Are you sure you want to delete this donor record? This action cannot be undone.")) {
              google.script.run.withSuccessHandler(() => {
                  google.script.run.withSuccessHandler(d => { donors = d; checkRender(); }).getData('HQ', 'Range_Donor_Database');
              }).deleteData('HQ','Range_Donor_Database',id);
          }
      };
  })();
</script>
