<!-- MODULE-SPECIFIC IMPORTS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<div class="p-4 no-print">
  <!-- HEADER -->
  <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
    <div>
      <h2 class="text-2xl font-bold text-teal-800">
        Approvals Management <span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full">HQ</span>
      </h2>
      <p class="text-gray-600 text-sm">Review & Process Project Requests</p>
    </div>

    <div>
       <button onclick="window.loadApprovals()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium py-2 px-4 rounded-lg shadow-sm border border-blue-200 transition">
          <i class="fa-solid fa-arrows-rotate mr-1"></i> Refresh List
       </button>
    </div>
  </div>

  <!-- STATS CARDS -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
     <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-orange-500">
        <div class="text-xs font-bold text-gray-400 uppercase">Pending Review</div>
        <div class="text-2xl font-bold text-orange-600 mt-1" id="stat_pending">0</div>
     </div>
     <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500">
        <div class="text-xs font-bold text-gray-400 uppercase">Approved This Month</div>
        <div class="text-2xl font-bold text-green-700 mt-1" id="stat_approved">0</div>
     </div>
     <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-red-500">
        <div class="text-xs font-bold text-gray-400 uppercase">Rejected This Month</div>
        <div class="text-2xl font-bold text-red-700 mt-1" id="stat_rejected">0</div>
     </div>
  </div>

  <!-- APPROVALS LIST -->
  <div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
      <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-teal-800 font-bold text-lg"><i class="fa-solid fa-list-check mr-2"></i>Request Queue</h3>
        <div class="flex gap-2">
            <select id="filter_status" onchange="window.renderApprovalsTable()" class="text-xs border-gray-300 rounded shadow-sm">
                <option value="Pending">Pending Only</option>
                <option value="All">All History</option>
            </select>
        </div>
      </div>
      <div class="p-4">
        <table id="mainApprovalsTable" class="display w-full text-sm text-left text-gray-500">
           <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
              <tr>
                 <th class="py-3 px-4">Req ID</th>
                 <th class="py-3 px-4">Date</th>
                 <th class="py-3 px-4">Project</th>
                 <th class="py-3 px-4">Details / Patient</th>
                 <th class="py-3 px-4">Est. Cost</th>
                 <th class="py-3 px-4">Status</th>
                 <th class="py-3 px-4 text-right">Action</th>
              </tr>
           </thead>
           <tbody></tbody>
        </table>
      </div>
  </div>
</div>

<!-- ACTION MODAL -->
<div id="action_modal" class="fixed inset-0 z-50 hidden bg-gray-900 bg-opacity-80 flex justify-center items-center">
    <div class="bg-white rounded-xl shadow-2xl w-11/12 md:w-1/3 overflow-hidden animate-fade-in-down">
        <div id="action_header" class="bg-gray-700 px-6 py-4 flex justify-between items-center text-white">
            <h3 class="font-bold text-lg" id="action_title">Process Request</h3>
            <button onclick="$('#action_modal').addClass('hidden')"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div class="p-6">
            <form id="form_action" onsubmit="window.handleActionSubmit(event)">
                <input type="hidden" name="Request_ID" id="act_req_id">
                <input type="hidden" name="Decision" id="act_decision">

                <div class="mb-4 bg-gray-50 p-3 rounded border border-gray-200">
                    <div class="flex justify-between mb-1"><span class="text-xs text-gray-500 uppercase">Project</span><span class="font-bold text-gray-800" id="act_project">...</span></div>
                    <div class="flex justify-between mb-1"><span class="text-xs text-gray-500 uppercase">Type</span><span class="font-bold text-gray-800" id="act_type">...</span></div>
                    <div class="flex justify-between"><span class="text-xs text-gray-500 uppercase">Cost</span><span class="font-bold text-gray-800" id="act_cost">...</span></div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Comments / Reason <span class="text-red-500">*</span></label>
                    <textarea name="Comments" id="act_comments" rows="3" required class="w-full rounded border-gray-300 shadow-sm focus:ring-teal-500" placeholder="Enter approval notes or rejection reason..."></textarea>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="$('#action_modal').addClass('hidden')" class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-50 font-bold">Cancel</button>
                    <button type="submit" id="btn_submit_action" class="px-6 py-2 bg-gray-600 text-white rounded font-bold shadow hover:bg-gray-700">Confirm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
  .animate-fade-in-down { animation: fadeInDown 0.3s ease-out; }
  @keyframes fadeInDown { from { opacity: 0; transform: translate3d(0, -20px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
</style>

<script>
   // DEFINE GLOBALS
   var allRequests = [];

   // ATTACH FUNCTIONS TO WINDOW
   window.loadApprovals = function() {
       if(typeof google === 'undefined') return;
       $('#mainApprovalsTable tbody').html('<tr><td colspan="7" class="text-center py-8 text-gray-500"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-teal-600"></i><br>Loading Requests...</td></tr>');

       google.script.run.withSuccessHandler(function(data) {
           allRequests = data;
           calcStats();
           window.renderApprovalsTable();
       }).getData('HQ', 'Central_Approvals');
   };

   function calcStats() {
       const pending = allRequests.filter(r => r.Approval_Status === 'Pending').length;

       // Calculate current month stats
       const now = new Date();
       const currentMonth = now.getMonth();
       const currentYear = now.getFullYear();

       const thisMonthReqs = allRequests.filter(r => {
           const d = new Date(r.Request_Date);
           return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
       });

       const approved = thisMonthReqs.filter(r => r.Approval_Status === 'Approved').length;
       const rejected = thisMonthReqs.filter(r => r.Approval_Status === 'Rejected').length;

       $('#stat_pending').text(pending);
       $('#stat_approved').text(approved);
       $('#stat_rejected').text(rejected);
   }

   window.renderApprovalsTable = function() {
       const filter = $('#filter_status').val();
       let data = filter === 'Pending' ? allRequests.filter(r => r.Approval_Status === 'Pending') : allRequests;

       // Sort: Pending first, then by date desc
       data.sort((a,b) => {
           if (a.Approval_Status === 'Pending' && b.Approval_Status !== 'Pending') return -1;
           if (a.Approval_Status !== 'Pending' && b.Approval_Status === 'Pending') return 1;
           return new Date(b.Request_Date) - new Date(a.Request_Date);
       });

       if ($.fn.DataTable.isDataTable('#mainApprovalsTable')) { $('#mainApprovalsTable').DataTable().destroy(); }

       $('#mainApprovalsTable').DataTable({
           data: data, destroy: true, autoWidth: false, pageLength: 25,
           columns: [
               { data: 'Request_ID', className: "font-mono text-xs font-bold" },
               { data: 'Request_Date', render: d => d ? new Date(d).toLocaleDateString() : '-' },
               { data: 'Source_Project', className: "font-bold text-teal-700" },
               { data: null, render: r => `<div><span class="font-bold">${r.Request_Type}</span></div><div class="text-xs text-gray-500">${r.Patient_Client_Name || '-'}</div>` },
               { data: 'Cost_Estimate', className: "text-right font-mono", render: c => c ? Number(c).toLocaleString() : '0' },
               { data: 'Approval_Status', className: "text-center", render: s => {
                   if(s === 'Pending') return `<span class="bg-orange-100 text-orange-800 text-xs px-2 py-1 rounded font-bold border border-orange-200">Pending</span>`;
                   if(s === 'Approved') return `<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded font-bold border border-green-200">Approved</span>`;
                   return `<span class="bg-red-100 text-red-800 text-xs px-2 py-1 rounded font-bold border border-red-200">${s}</span>`;
               }},
               { data: null, className: "text-right", render: (d,t,r) => {
                   if(r.Approval_Status !== 'Pending') return `<span class="text-xs text-gray-400 italic">Closed</span>`;
                   return `
                     <button onclick="window.openActionModal('${r.Request_ID}', 'Approved')" class="bg-green-50 text-green-600 hover:bg-green-100 border border-green-200 p-1.5 rounded mr-1 transition" title="Approve"><i class="fa-solid fa-check"></i></button>
                     <button onclick="window.openActionModal('${r.Request_ID}', 'Rejected')" class="bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 p-1.5 rounded transition" title="Reject"><i class="fa-solid fa-xmark"></i></button>
                   `;
               }}
           ]
       });
   };

   window.openActionModal = function(reqId, action) {
       const req = allRequests.find(r => r.Request_ID === reqId);
       if(!req) return;

       $('#act_req_id').val(reqId);
       $('#act_decision').val(action);
       $('#act_project').text(req.Source_Project);
       $('#act_type').text(req.Request_Type);
       $('#act_cost').text(req.Cost_Estimate ? Number(req.Cost_Estimate).toLocaleString() : '0');
       $('#act_comments').val('');

       if(action === 'Approved') {
           $('#action_header').removeClass('bg-red-700 bg-gray-700').addClass('bg-green-600');
           $('#action_title').text('Approve Request');
           $('#btn_submit_action').removeClass('bg-red-600 bg-gray-600').addClass('bg-green-600 hover:bg-green-700').text('Approve');
           $('#act_comments').attr('placeholder', 'Optional approval notes...');
           $('#act_comments').prop('required', false); // Comments optional for approval
       } else {
           $('#action_header').removeClass('bg-green-600 bg-gray-700').addClass('bg-red-600');
           $('#action_title').text('Reject Request');
           $('#btn_submit_action').removeClass('bg-green-600 bg-gray-600').addClass('bg-red-600 hover:bg-red-700').text('Reject');
           $('#act_comments').attr('placeholder', 'Please provide a reason for rejection...');
           $('#act_comments').prop('required', true); // Comments mandatory for rejection
       }

       $('#action_modal').removeClass('hidden');
   };

   window.handleActionSubmit = function(e) {
       e.preventDefault();
       const reqId = $('#act_req_id').val();
       const decision = $('#act_decision').val();
       const comments = $('#act_comments').val();
       const btn = $('#btn_submit_action');

       btn.html('<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Processing...').prop('disabled', true);

       google.script.run.withSuccessHandler(function(res) {
           if(res.toString().includes("Error")) {
               alert(res);
           } else {
               alert("Request " + decision + " Successfully!");
               $('#action_modal').addClass('hidden');
               window.loadApprovals();
           }
           btn.text(decision).prop('disabled', false);
       }).withFailureHandler(function(err) {
           alert("System Error: " + err.message);
           btn.text(decision).prop('disabled', false);
       }).processApproval(reqId, decision, comments);
   };

   // INIT
   (function() {
      const init = () => {
         // Safe check for loadApprovals existence before calling
         if(typeof window.loadApprovals === 'function') {
            window.loadApprovals();
         }
      };

      // Check if jQuery is ready
      if (typeof $ === 'undefined') {
         // Retry after a short delay if $ is not defined yet
         setTimeout(init, 500);
      } else {
         $(document).ready(function() {
             setTimeout(init, 300);
         });
      }
   })();
</script>
