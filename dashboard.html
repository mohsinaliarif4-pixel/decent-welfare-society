<!-- KPI Cards -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
  <div class="card p-4 border-l-4 border-teal-500">
    <div class="flex justify-between">
      <div>
        <div class="text-gray-500 text-sm">Total Approvals (HQ)</div>
        <div class="text-2xl font-bold text-gray-800" id="kpi-total">0</div>
      </div>
      <div class="text-teal-500"><i class="fa-solid fa-clipboard-check text-2xl"></i></div>
    </div>
  </div>

  <div class="card p-4 border-l-4 border-orange-500">
    <div class="flex justify-between">
      <div>
        <div class="text-gray-500 text-sm">Pending Requests</div>
        <div class="text-2xl font-bold text-gray-800" id="kpi-pending">Loading...</div>
      </div>
      <div class="text-orange-500"><i class="fa-solid fa-clock text-2xl"></i></div>
    </div>
  </div>

   <div class="card p-4 border-l-4 border-blue-500">
    <div class="flex justify-between">
      <div>
        <div class="text-gray-500 text-sm">Active Projects</div>
        <div class="text-2xl font-bold text-gray-800">4</div>
      </div>
      <div class="text-blue-500"><i class="fa-solid fa-hospital text-2xl"></i></div>
    </div>
  </div>

  <div class="card p-4 border-l-4 border-purple-500">
    <div class="flex justify-between">
      <div>
        <div class="text-gray-500 text-sm">My Access</div>
        <div class="text-sm font-bold text-gray-800" id="kpi-dept">...</div>
      </div>
      <div class="text-purple-500"><i class="fa-solid fa-id-badge text-2xl"></i></div>
    </div>
  </div>
</div>

<!-- Charts Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
  <div class="card p-4">
    <h3 class="text-lg font-semibold mb-4 text-gray-700">Recent Approval Activity</h3>
    <div id="approvalsTableContainer">
        <table id="approvalsTable" class="w-full text-sm text-left text-gray-500 display">
            <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                <tr>
                    <th>Req ID</th>
                    <th>Project</th>
                    <th>Type</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
  </div>

  <div class="card p-4">
    <h3 class="text-lg font-semibold mb-4 text-gray-700">Project Overview</h3>
    <div id="chart-main" class="flex justify-center items-center h-64 text-gray-400">
      Chart Loading...
    </div>
  </div>
</div>
