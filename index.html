    <!-- Logic Script -->
    <?!= include('js'); ?>

    <script>
       // LOGIN LOGIC
       function attemptLogin() {
           const email = $('#login_email').val().trim();
           if(!email) { alert("Please enter your email."); return; }

           const btn = $('#btn_login');
           const originalText = btn.text();
           btn.html('<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...').prop('disabled', true);
           $('#login_error').addClass('hidden');

           google.script.run.withSuccessHandler(function(response) {
               if(response.allowed) {
                   // Success
                   $('#login-overlay').fadeOut(500, function() {
                       $('#app-container').removeClass('hidden').addClass('flex');
                       // Initialize App Data
                       $('#user-name').text(response.name);
                       $('#user-role').text(response.role);

                       // Trigger global init if available
                       if(typeof initializeApp === 'function') initializeApp(response);
                   });
               } else {
                   // Fail
                   $('#login_error').removeClass('hidden');
                   btn.text(originalText).prop('disabled', false);
               }
           }).withFailureHandler(function(err) {
               alert("Connection Error: " + err.message);
               btn.text(originalText).prop('disabled', false);
           }).verifyUserLogin(email);
       }

       // Allow 'Enter' key to login
       $('#login_email').on('keypress', function (e) {
            if(e.which === 13) attemptLogin();
       });
    </script>
  </body>
